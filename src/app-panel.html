<!doctype html>
<html lang="zh-CN"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<style>
*{box-sizing:border-box}body{margin:0;font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:#1f2329;background:#f5f6f7;border-left:1px solid #dfe1e6;height:44px;display:flex;align-items:center;gap:6px;padding:5px 10px}nav{display:flex;gap:4px;flex:1;overflow:hidden}button{font:inherit;color:inherit;white-space:nowrap;border:0;border-radius:6px;padding:6px 9px;background:transparent;cursor:pointer}button:hover{background:#e6e8ec}button[aria-selected=true]{color:#1456f0;background:#e9efff}button[hidden]{display:none}

<body><button id="back" title="返回详情" hidden>‹ 返回</button><nav id="apps" aria-label="应用详情"></nav><button id="reload" title="刷新页面">↻</button><button id="close" title="关闭详情">✕</button><script src="app-panel.js"></script></body></html>
